name: Auto Deploy GitBook

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # 允许手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      
    - name: Build and Deploy GitBook
      run: |
        # 创建临时目录
        tmpdir=$(mktemp -d)
        builddir=$(mktemp -d)
        
        # 清理函数
        cleanup() {
          rm -rf "$tmpdir" 2>/dev/null || true
          rm -rf "$builddir" 2>/dev/null || true
        }
        trap cleanup EXIT
        
        echo "🚀 Starting GitBook build and deployment..."
        
        # 校验部署凭据（公开仓库 clone 可不鉴权，push 必须有有效 token）
        if [ -z "${{ secrets.DEPLOY_TOKEN }}" ]; then
          echo "❌ DEPLOY_TOKEN secret is empty or not configured"
          echo "   Add a PAT with write access to hitzhangjie/debugger101.io"
          echo "   at Settings → Secrets and variables → Actions → DEPLOY_TOKEN"
          exit 1
        fi

        # x-access-token:TOKEN 避免 Git 把 token 当 username 后继续要 Password
        REPO_URL="https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/hitzhangjie/debugger101.io.git"

        # 克隆目标仓库
        echo "📥 Cloning target repository..."
        git clone --depth 1 "$REPO_URL" "$tmpdir"

        # 使用Docker构建GitBook
        echo "🔨 Building GitBook with Docker..."
        docker run --name gitbook --rm \
          -v ${PWD}:/root/gitbook \
          -v $builddir:$builddir \
          hitzhangjie/gitbook-cli:latest \
          bash -c "cd book && gitbook install && cd - && gitbook build book $builddir"
        
        # 复制构建结果到目标目录
        echo "📋 Copying build results..."
        cp -rf $builddir/* $tmpdir/
        
        # 提交更改
        echo "💾 Committing changes..."
        cd $tmpdir
        git config --local user.name "hitzhangjie"
        git config --local user.email "hit.zhangjie@gmail.com"
        git add .
        # 无变更时跳过，避免空 commit 导致失败
        if git diff --cached --quiet; then
          echo "ℹ️ No content changes, skip deploy"
          exit 0
        fi
        git commit -m "Auto-deploy: $(date)"
        git remote set-url origin "$REPO_URL"
        git push -f -u origin master
        cd -
        
        echo "✅ Deployment completed successfully!" 